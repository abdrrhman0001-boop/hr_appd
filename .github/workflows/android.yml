name: Build APK
"on":
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.22.x' }
      - name: Generate platform folders + Build APK
        run: |
          if [ -f pubspec.yaml ]; then APP_DIR=.; else APP_DIR=hr_app; fi
          cd $APP_DIR
          flutter create --platforms=android --project-name hr_company_app --org com.company.hr .
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hr-app-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
